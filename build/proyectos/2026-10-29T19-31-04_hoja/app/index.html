<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Simulación</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body >

    <div class="spreadsheet-container">
        <!-- Header Row (Column Letters A-J) -->
        <div class="header row-labels">
            <div class="corner-cell"></div>
            <div class="col-label" data-col="A">A</div>
            <div class="col-label" data-col="B">B</div>
            <div class="col-label" data-col="C">C</div>
            <div class="col-label" data-col="D">D</div>
            <div class="col-label" data-col="E">E</div>
            <div class="col-label" data-col="F">F</div>
            <div class="col-label" data-col="G">G</div>
            <div class="col-label" data-col="H">H</div>
            <div class="col-label" data-col="I">I</div>
            <div class="col-label" data-col="J">J</div>
        </div>

        <!-- Main Grid Content (Rows 1 to 20) -->
        <div id="spreadsheet-grid">
            <!-- Row 1 -->
            <div class="row-container" data-row="1">
                <div class="row-label" data-row="1">1</div>
                <!-- Cells A1 to J1 -->
                <div class="cell" data-col="A" data-row="1" contenteditable="true"></div>
                <div class="cell" data-col="B" data-row="1" contenteditable="true"></div>
                <div class="cell" data-col="C" data-row="1" contenteditable="true"></div>
                <div class="cell" data-col="D" data-row="1" contenteditable="true"></div>
                <div class="cell" data-col="E" data-row="1" contenteditable="true"></div>
                <div class="cell" data-col="F" data-row="1" contenteditable="true"></div>
                <div class="cell" data-col="G" data-row="1" contenteditable="true"></div>
                <div class="cell" data-col="H" data-row="1" contenteditable="true"></div>
                <div class="cell" data-col="I" data-row="1" contenteditable="true"></div>
                <div class="cell" data-col="J" data-row="1" contenteditable="true"></div>
            </div>

            <!-- Row 2 -->
            <div class="row-container" data-row="2">
                <div class="row-label" data-row="2">2</div>
                <div class="cell" data-col="A" data-row="2" contenteditable="true"></div>
                <div class="cell" data-col="B" data-row="2" contenteditable="true"></div>
                <div class="cell" data-col="C" data-row="2" contenteditable="true"></div>
                <div class="cell" data-col="D" data-row="2" contenteditable="true"></div>
                <div class="cell" data-col="E" data-row="2" contenteditable="true"></div>
                <div class="cell" data-col="F" data-row="2" contenteditable="true"></div>
                <div class="cell" data-col="G" data-row="2" contenteditable="true"></div>
                <div class="cell" data-col="H" data-row="2" contenteditable="true"></div>
                <div class="cell" data-col="I" data-row="2" contenteditable="true"></div>
                <div class="cell" data-col="J" data-row="2" contenteditable="true"></div>
            </div>

            <!-- Row 3 -->
            <div class="row-container" data-row="3">
                <div class="row-label" data-row="3">3</div>
                <div class="cell" data-col="A" data-row="3" contenteditable="true"></div>
                <div class="cell" data-col="B" data-row="3" contenteditable="true"></div>
                <div class="cell" data-col="C" data-row="3" contenteditable="true"></div>
                <div class="cell" data-col="D" data-row="3" contenteditable="true"></div>
                <div class="cell" data-col="E" data-row="3" contenteditable="true"></div>
                <div class="cell" data-col="F" data-row="3" contenteditable="true"></div>
                <div class="cell" data-col="G" data-row="3" contenteditable="true"></div>
                <div class="cell" data-col="H" data-row="3" contenteditable="true"></div>
                <div class="cell" data-col="I" data-row="3" contenteditable="true"></div>
                <div class="cell" data-col="J" data-row="3" contenteditable="true"></div>
            </div>

            <!-- Placeholder for Rows 4 through 20 -->

        </div >

        <!-- Row Control Panel (NEW) -->
        <div class="row-controls">
            <h4>Controles de Fila</h4>
            <button id="delete-row-btn" disabled>🗑️ Borrar Fila</button>
            <label for="bg-color">Color Fondo:</label>
            <input type="color" id="bg-color" value="#ffffff">
            <button id="set-color-btn" disabled>🎨 Aplicar Color</button>
            <button id="clear-content-btn" disabled>🗑️ Vaciar Contenido</button>
        </div>

        <!-- Column Control Panel (NEW) -->
        <div class="col-controls">
            <h4>Controles de Columna</h4>
            <button id="hide-column-btn" disabled>👁️ Ocultar Columna</button>
            <button id="show-column-btn" disabled>🔍 Mostrar Columna</button>
        </div>

    </div >

    <script src="script.js"></script>
</body>
</html>
