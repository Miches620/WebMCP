<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Avanzada</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="spreadsheet-container">
        <!-- Header for Column Letters (A to J) -->
        <div id="column-headers">
            <div class="corner-cell"></div>
            <!-- Column letters A through J will be dynamically generated or structured here -->
            <div data-col="A" class="header-cell col-header">A</div>
            <div data-col="B" class="header-cell col-header">B</div>
            <div data-col="C" class="header-cell col-header">C</div>
            <div data-col="D" class="header-cell col-header">D</div>
            <div data-col="E" class="header-cell col-header">E</div>
            <div data-col="F" class="header-cell col-header">F</div>
            <div data-col="G" class="header-cell col-header">G</div>
            <div data-col="H" class="header-cell col-header">H</div>
            <div data-col="I" class="header-cell col-header">I</div>
            <div data-col="J" class="header-cell col-header">J</div>
        </div>

        <!-- Main Grid Area -->
        <div id="grid-area">
            <!-- Row 1 Header (Number) -->
            <div class="row-header" data-row="1">1</div>

            <!-- Rows 1 through 20 will be generated here by JS, but we need the structure for the first few rows to ensure layout integrity. -->
            <!-- We will use a loop in JS, so only the structural container is needed, but let's pre-populate enough cells/rows to define the scope (A1:J20). -->

            <div id="data-grid">
                <!-- Row 1 -->
                <div class="row" data-row="1">
                    <div class="cell row-header-content">1</div>
                    <div class="spreadsheet-cell" data-col="A" data-row="1"></div>
                    <div class="spreadsheet-cell" data-col="B" data-row="1"></div>
                    <div class="spreadsheet-cell" data-col="C" data-row="1"></div>
                    <div class="spreadsheet-cell" data-col="D" data-row="1"></div>
                    <div class="spreadsheet-cell" data-col="E" data-row="1"></div>
                    <div class="spreadsheet-cell" data-col="F" data-row="1"></div>
                    <div class="spreadsheet-cell" data-col="G" data-row="1"></div>
                    <div class="spreadsheet-cell" data-col="H" data-row="1"></div>
                    <div class="spreadsheet-cell" data-col="I" data-row="1"></div>
                    <div class="spreadsheet-cell" data-col="J" data-row="1"></div>
                </div>

                <!-- Row 2 -->
                <div class="row" data-row="2">
                    <div class="cell row-header-content">2</div>
                    <div class="spreadsheet-cell" data-col="A" data-row="2"></div>
                    <div class="spreadsheet-cell" data-col="B" data-row="2"></div>
                    <div class="spreadsheet-cell" data-col="C" data-row="2"></div>
                    <div class="spreadsheet-cell" data-col="D" data-row="2"></div>
                    <div class="spreadsheet-cell" data-col="E" data-row="2"></div>
                    <div class="spreadsheet-cell" data-col="F" data-row="2"></div>
                    <div class="spreadsheet-cell" data-col="G" data-row="2"></div>
                    <div class="spreadsheet-cell" data-col="H" data-row="2"></div>
                    <div class="spreadsheet-cell" data-col="I" data-row="2"></div>
                    <div class="spreadsheet-cell" data-col="J" data-row="2"></div>
                </div>

                <!-- ... (Rows 3 through 19 would follow this pattern) ... -->
                <!-- To keep the HTML clean and manageable, we rely on JS to generate the remaining 18 rows dynamically based on the structure defined by the first two. -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
