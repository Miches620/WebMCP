<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Avanzada</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Hoja de Cálculo</h1>

    <!-- Main Spreadsheet Container: Row Labels | Grid Content -->
    <div id="spreadsheet-container">
        <!-- This container holds the row numbers (1, 2, ...) -->
        <div id="row-labels-container"></div> 
        <!-- This container holds all the actual cells (A1 to J20) -->
        <div id="grid-area"></div>
    </div>

    <!-- Controls Area -->
    <div id="controls">
        <button id="btn-clear-selection" disabled>Limpiar Selección</button>
        <input type="color" id="color-picker" value="#ffffff">
        <button id="btn-apply-color" disabled>Aplicar Color</button>
        <button id="btn-delete-column" disabled>Eliminar Columna</button>
        <button id="btn-delete-row" disabled>Eliminar Fila</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
