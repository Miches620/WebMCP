<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Simple</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body >

    <h1>Hoja de Cálculo</h1>

    <!-- Contenedor principal que simula la hoja de cálculo -->
    <div id="spreadsheet-container">
        <table>
            <thead>
                <tr>
                    <th></th> <!-- Celda vacía para los números de fila -->
                    <th data-col-name="A">A</th>
                    <th data-col-name="B">B</th>
                    <th data-col-name="C">C</th>
                    <th data-col-name="D">D</th>
                    <th data-col-name="E">E</th>
                    <th data-col-name="F">F</th>
                    <th data-col-name="G">G</th>
                    <th data-col-name="H">H</th>
                    <th data-col-name="I">I</th>
                    <th data-col-name="J">J</th>
                </tr>
            </thead>
            <tbody>
                <!-- Las 20 filas de datos (1 a 20) se generarán aquí mediante JavaScript -->
                <tr id="row-header-1">
                    <td class="row-index">1</td>
                    <td data-row="1" data-col="A" contenteditable="true"></td>
                    <td data-row="1" data-col="B" contenteditable="true"></td>
                    <td data-row="1" data-col="C" contenteditable="true"></td>
                    <td data-row="1" data-col="D" contenteditable="true"></td>
                    <td data-row="1" data-col="E" contenteditable="true"></td>
                    <td data-row="1" data-col="F" contenteditable="true"></td>
                    <td data-row="1" data-col="G" contenteditable="true"></td>
                    <td data-row="1" data-col="H" contenteditable="true"></td>
                    <td data-row="1" data-col="I" contenteditable="true"></td>
                    <td data-row="1" data-col="J" contenteditable="true"></td>
                </tr >
                <!-- Se replicarán 19 filas más (2 a 20) en JS o se dejarán vacías para que el script las complete -->
            </tbody>
        </table>
    </div>

    <!-- Controles de gestión visibles arriba de la tabla -->
    <div id="controls">
        <button id="btn-delete-column" disabled>Borrar Columna</button>
        <button id="btn-clear-data">Vaciar Datos Seleccionados</button>
        <label for="colorPicker">Color Fondo:</label>
        <input type="color" id="colorPicker" value="#ffffff">
        <button id="btn-apply-color">Aplicar Color</button>
        <button id="btn-hide-row">Ocultar Fila</button>
        <button id="btn-show-row" style="display: none;">Mostrar Fila</button>
        <button id="btn-delete-row" disabled>Borrar Fila</button>
        <button id="btn-clear-column">Vaciar Columna</button>
        <button id="btn-hide-col">Ocultar Columna</button>
        <button id="btn-show-col" style="display: none;">Mostrar Columna</button>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body >
