<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 
        Contenedor principal del simulador de hoja de cálculo.
        La estructura está diseñada para manejar 20 filas y 10 columnas (A-J).
    -->
    <div id="spreadsheet">
        <!-- Fila de encabezados (Row Labels y Corner) -->
        <div class="header row-labels">
            <span class="corner-cell"></span> <!-- Esquina superior izquierda -->
            <span class="row-label" data-row="1">1</span>
            <span class="row-label" data-row="2">2</span>
            <span class="row-label" data-row="3">3</span>
            <span class="row-label" data-row="4">4</span>
            <span class="row-label" data-row="5">5</span>
            <span class="row-label" data-row="6">6</span>
            <span class="row-label" data-row="7">7</span>
            <span class="row-label" data-row="8">8</span>
            <span class="row-label" data-row="9">9</span>
            <span class="row-label" data-row="10">10</span>
            <span class="row-label" data-row="11">11</span>
            <span class="row-label" data-row="12">12</span>
            <span class="row-label" data-row="13">13</span>
            <span class="row-label" data-row="14">14</span>
            <span class="row-label" data-row="15">15</span>
            <span class="row-label" data-row="16">16</span>
            <span class="row-label" data-row="17">17</span>
            <span class="row-label" data-row="18">18</span>
            <span class="row-label" data-row="19">19</span>
            <span class="row-label" data-row="20">20</span>
        </div>
        <!-- Fila de encabezados de columna (A a J) -->
        <div class="header col-labels">
            <span></span> <!-- Espacio vacío para la esquina superior izquierda -->
            <span class="col-letter" data-col="A">A</span>
            <span class="col-letter" data-col="B">B</span>
            <span class="col-letter" data-col="C">C</span>
            <span class="col-letter" data-col="D">D</span>
            <span class="col-letter" data-col="E">E</span>
            <span class="col-letter" data-col="F">F</span>
            <span class="col-letter" data-col="G">G</span>
            <span class="col-letter" data-col="H">H</span>
            <span class="col-letter" data-col="I">I</span>
            <span class="col-letter" data-col="J">J</span>
        </div>
        <!-- Contenedor de las celdas (20 filas x 10 columnas) -->
        <div id="cell-grid">
            <!-- Las celdas se inyectan aquí por JavaScript -->
        </div>
    </div>

    <!-- Controles de columna (Fuera del grid principal, ya que son acciones) -->
    <div id="column-controls" style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button id="btn-color" disabled>Color</button>
        <input type="color" id="color-picker" value="#ffffff" style="display: none;" disabled>
        <button id="btn-clear" disabled>Vaciar Columna</button>
        <button id="btn-delete" disabled>Borrar Columna</button>
    </div>


    <script src="script.js"></script>

</body >
