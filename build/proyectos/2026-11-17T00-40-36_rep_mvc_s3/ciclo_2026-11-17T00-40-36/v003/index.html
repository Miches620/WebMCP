<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- 
        Contenedor principal del simulador de hoja de cálculo.
        La estructura está diseñada para manejar 20 filas y 10 columnas (A-J).
    -->
    <div id="spreadsheet">
        <!-- CONTROLES DE CELDA -->
        <!-- CONTROLES DE CELDA -->
        <div class="header cell-controls" style="grid-column: 1 / span 1;">
            <button id="colorButton">🎨 Color</button>
            <div id="columnControls" style="margin-left: 20px; display: flex; gap: 10px;">
                <button id="clearColumnContentBtn" disabled>🗑️ Vaciar Columna</button>
                <button id="deleteColumnBtn" disabled>❌ Borrar Columna (Estado)</button>
            </div>
            <span id="selectedCellDisplay" style="margin-left: 20px; font-size: 0.9em;"></span>
        </div>

        <!-- Fila de encabezados: Corner, Column Letters A-J -->
        <div class="header corner-cell" style="grid-column: 1 / span 1;"></div>
        <!-- Fila de encabezados: Corner, Column Letters A-J -->
        <div class="header col-labels" id="columnLabels">
            <span></span> <!-- Espacio vacío para la esquina superior izquierda -->
            <span class="col-letter column-label" data-col="A">A</span>
            <span class="col-letter column-label" data-col="B">B</span>
            <span class="col-letter column-label" data-col="C">C</span>
            <span class="col-letter column-label" data-col="D">D</span>
            <span class="col-letter column-label" data-col="E">E</span>
            <span class="col-letter column-label" data-col="F">F</span>
            <span class="col-letter column-label" data-col="G">G</span>
            <span class="col-letter column-label" data-col="H">H</span>
            <span class="col-letter column-label" data-col="I">I</span>
            <span class="col-letter column-label" data-col="J">J</span>
        </div >

        <!-- Fila de encabezados: Números de fila (1 a 20) -->
        <div class="header row-number-labels">
            <span class="row-label-placeholder"></span> <!-- Espacio vacío para la esquina superior izquierda -->
            <span class="row-number-label">1</span>
            <span class="row-number-label">2</span>
            <span class="row-number-label">3</span>
            <span class="row-number-label">4</span>
            <span class="row-number-label">5</span>
            <span class="row-number-label">6</span>
            <span class="row-number-label">7</span>
            <span class="row-number-label">8</span>
            <span class="row-number-label">9</span>
            <span class="row-number-label">10</span>
            <span class="row-number-label">11</span>
            <span class="row-number-label">12</span>
            <span class="row-number-label">13</span>
            <span class="row-number-label">14</span>
            <span class="row-number-label">15</span>
            <span class="row-number-label">16</span>
            <span class="row-number-label">17</span>
            <span class="row-number-label">18</span>
            <span class="row-number-label">19</span>
            <span class="row-number-label">20</span>
        </div>

        <!-- Contenedor de las celdas (20 filas x 10 columnas) -->
        <div id="cell-grid">
            <!-- Fila 1 (Row Label 1) -->
            <div class="row-label" data-row="1">1</div>
            <div class="cell editable" contenteditable="true" data-col="A" data-row="1" tabindex="0"></div>
            <div class="cell editable" contenteditable="true" data-col="B" data-row="1" tabindex="0"></div>
            <div class="cell editable" contenteditable="true" data-col="C" data-row="1" tabindex="0"></div>
            <div class="cell editable" contenteditable="true" data-col="D" data-row="1" tabindex="0"></div>
            <div class="cell editable" contenteditable="true" data-col="E" data-row="1" tabindex="0"></div>
            <div class="cell editable" contenteditable="true" data-col="F" data-row="1" tabindex="0"></div>
            <div class="cell editable" contenteditable="true" data-col="G" data-row="1" tabindex="0"></div>
            <div class="cell editable" contenteditable="true" data-col="H" data-row="1" tabindex="0"></div>
            <div class="cell editable" contenteditable="true" data-col="I" data-row="1" tabindex="0"></div>
            <div class="cell editable" contenteditable="true" data-col="J" data-row="1" tabindex="0"></div>

            <!-- ... Las 19 filas restantes (2 a 20) se cargarán o estarán estructuradas de manera similar. -->
        </div>
    </div>


    <script src="script.js"></script>

</body >
