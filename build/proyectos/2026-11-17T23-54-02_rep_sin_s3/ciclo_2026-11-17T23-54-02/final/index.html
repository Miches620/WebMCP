<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body >

    <!-- 
        Contenedor principal del simulador de hoja de cálculo.
        La estructura está diseñada para manejar 20 filas y 10 columnas (A-J).
    -->
    <div id="spreadsheet">
        
        <!-- Fila de encabezados de columna (A a J) -->
        <div class="header row-label" style="grid-column: 1 / span 1;"></div>
        <div class="header col-labels">
            <span></span title="Filas"> <!-- Espacio vacío para la esquina superior izquierda -->
            <span class="col-letter">A</span>
            <span class="col-letter">B</span>
            <span class="col-letter">C</span>
            <span class="col-letter">D</span>
            <span class="col-letter">E</span>
            <span class="col-letter">F</span>
            <span class="col-letter">G</span>
            <span class="col-letter">H</span>
            <span class="col-letter">I</span>
            <span class="col-letter">J</span>
        </div>

        <!-- Fila 1 (Row Label 1) -->
        <div class="row-label" data-row="1">1</div>
        <div class="cell editable" contenteditable="true" data-col="A" data-row="1" tabindex="0"></div>
        <div class="cell editable" contenteditable="true" data-col="B" data-row="1" tabindex="0"></div>
        <div class="cell editable" contenteditable="true" data-col="C" data-row="1" tabindex="0"></div>
        <div class="cell editable" contenteditable="true" data-col="D" data-row="1" tabindex="0"></div>
        <div class="cell editable" contenteditable="true" data-col="E" data-row="1" tabindex="0"></div>
        <div class="cell editable" contenteditable="true" data-col="F" data-row="1" tabindex="0"></div>
        <div class="cell editable" contenteditable="true" data-col="G" data-row="1" tabindex="0"></div>
        <div class="cell editable" contenteditable="true" data-col="H" data-row="1" tabindex="0"></div>
        <div class="cell editable" contenteditable="true" data-col="I" data-row="1" tabindex="0"></div>
        <div class="cell editable" contenteditable="true" data-col="J" data-row="1" tabindex="0"></div>

        <!-- Las 19 filas restantes (2 a 20) serán añadidas por JavaScript -->
    </div>


    <div id="color-picker-container">
        <h3>Color de Fondo</h3>
        <label for="bg-color-input">Seleccionar color:</label>
        <input type="color" id="bg-color-input" value="#ffffff">
        <button id="apply-color-btn">Aplicar Color</button>
    </div>

    <div id="column-actions-container">
        <h3>Acciones de Columna</h3>
        <button id="clear-contents-btn">Borrar Contenido</button>
        <button id="delete-col-btn" style="background-color: #dc3545; color: white;">Eliminar Columna</button>

        <hr style="margin: 10px 0;">
        <h4>Gestión de Visibilidad</h4>
        <div id="visibility-controls">
            <!-- Controles para Columnas -->
            <button id="hide-col-btn" disabled>Ocultar Columna</button>
            <button id="show-col-btn" disabled style="background-color: #6c757d; color: white;">Mostrar Columna</button>

            <!-- Controles para Filas -->
            <button id="hide-row-btn" disabled>Ocultar Fila</button>
            <button id="show-row-btn" disabled style="background-color: #6c757d; color: white;">Mostrar Fila</button>
        </div>
    </div>


    <script src="script.js"></script>

</body>
</html>
