<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Page de Café Especialidad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="site-header">
    <h1>Landing Page de Café Especialidad</h1>
    <nav>
      <ul>
        <li><a href="#catalogo-de-cafes">Catalogo de cafés</a></li>
        <li><a href="#formulario-de-contacto">Formulario de contacto</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#carta">Carta</a></li>
      </ul>
    </nav>
  </header>
  <main id="app">
    <section id="catalogo-de-cafes" data-feature="R1">
      <h2>Catalogo de cafés</h2>
      <!-- R1: Catalogo de cafés en tarjetas con foto superior e información inferior (en carrousel) -->
    </section>

    <section id="formulario-de-contacto" data-feature="R2">
      <h2>Formulario de contacto</h2>
      <!-- R2: Formulario de contacto con campos obligatorios y opcionalmente un campo para preferencias -->
    </section>

    <section id="nosotros" data-feature="R3">
      <h2>Nosotros</h2>
      <!-- R3: Sección 'Nosotros' con historia de la empresa -->
    </section>

    <section id="carta" data-feature="R4">
      <h2>Carta</h2>
      <!-- R4: Sección 'Carta' con productos disponibles actualmente, obtenidos desde archivo de texto -->
    </section>
  </main>
  <footer id="site-footer">
    <p>Landing Page de Café Especialidad</p>
  </footer>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
