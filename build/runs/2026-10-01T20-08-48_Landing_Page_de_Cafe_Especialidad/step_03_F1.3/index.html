<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café Especialidad - Tu Experiencia Aromática</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body >
  <header id="site-header">
    <h1 class="logo">Aroma Café</h1>
    <nav>
      <ul>
        <li><a href="#catalogo-de-cafes">Catálogo</a></li>
        <li><a href="#formulario-de-contacto">Contacto</a></li>
        <li><a href="#nosotros">Nosotros</a></li>
        <li><a href="#carta">Carta</a></li>
      </ul>
    </nav>
  </header>
  <main id="app">
    <section id="catalogo-de-cafes" data-feature="R1">
      <h2>Nuestro Catálogo de Cafés</h2>
      <!-- R1: Catalogo de cafés en tarjetas con foto superior e información inferior (en carrousel) -->
    </section>

    <section id="formulario-de-contacto" data-feature="R2">
      <h2>Contáctanos</h2>
      <!-- R2: Formulario de contacto con campos obligatorios y opcionalmente un campo para preferencias -->
    </section>

    <section id="nosotros" data-feature="R3">
      <div class="nosotros-content-wrapper">
        <h2>Nuestra Historia</h2>
        <!-- R3: Sección 'Nosotros' con historia de la empresa -->
      </div>
    </section>

    <section id="carta" data-feature="R4">
      <h2>Nuestra Carta</h2>
      <!-- R4: Sección 'Carta' con productos disponibles actualmente, obtenidos desde archivo de texto -->
    </section>
  </main>
  <footer id="site-footer">
    <p>&copy; 2024 Aroma Café. Todos los derechos reservados.</p>
  </footer>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body >
</html>
