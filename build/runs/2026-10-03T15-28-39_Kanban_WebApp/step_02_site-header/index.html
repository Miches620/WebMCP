<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban WebApp</title>
  <style>
/* ===== tokens.css (global) ===== */
:root {
  
  --color-bg-primary: #12141a; 
  --color-surface-card: #1e2027; 
  --color-text-default: #e0e6f0; 
  --color-text-secondary: #a0aec0; 
  --color-accent-primary: #4a90e2; 
  --color-accent-hover: #6fa8ff; 
  --color-border: #3f4451; 
  --color-success: #48bb78;
  --color-error: #f56565;

  
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;

  
  --radius-sm: 4px;
  --radius-md: 8px;
  --shadow-base: 0 4px 12px rgba(0, 0, 0, 0.3); 
  --transition-speed: 0.2s ease-in-out;
}
*, *::before, *::after {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 0;
  background-color: var(--color-bg-primary);
  color: var(--color-text-default);
  font-family: var(--font);
  line-height: 1.6;
}
.container {
  width: 100%;
  max-width: 1400px; 
  margin: 0 auto;
  padding: var(--spacing-md);
}
h1, h2, h3 {
  color: var(--color-text-default);
  margin-top: 0;
  line-height: 1.2;
}
h1 {
  font-size: 2.5rem;
  border-bottom: 2px solid var(--color-accent-primary);
  padding-bottom: var(--spacing-sm);
  display: inline-block;
}
h2 {
  font-size: 1.8rem;
  margin-top: var(--spacing-lg);
  color: var(--color-text-default);
}
h3 {
  font-size: 1.4rem;
  margin-bottom: var(--spacing-sm);
}
p {
  margin-bottom: var(--spacing-md);
  color: var(--color-text-default);
}
a {
  color: var(--color-accent-primary);
  text-decoration: none;
  transition: color var(--transition-speed), opacity var(--transition-speed);
}
a:hover {
  color: var(--color-accent-hover);
  opacity: 0.9;
}
.btn {
  display: inline-block;
  padding: var(--spacing-sm) var(--spacing-md);
  border: none;
  cursor: pointer;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-radius: var(--radius-sm);
  transition: all var(--transition-speed);
  background-color: var(--color-accent-primary);
  color: white;
}
.btn:hover {
  background-color: var(--color-accent-hover);
  box-shadow: 0 6px 15px rgba(74, 144, 226, 0.4); 
  transform: translateY(-2px);
}
.btn-secondary {
    background-color: var(--color-border);
    color: var(--color-text-default);
}
.btn-secondary:hover {
    background-color: #5a6070;
    box-shadow: none;
}

/* ===== componente #site-header ===== */
#site-header {
    background-color: var(--color-surface-card);
    padding: var(--spacing-md) 0;
    box-shadow: var(--shadow-base);
    position: sticky;
    top: 0;
    z-index: 100;
}
#site-header .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap; 
}
#site-header .brand {
    font-size: 1.8rem;
    font-weight: bold;
    color: var(--color-accent-primary);
    letter-spacing: 1px;
}
#site-header nav {
    flex-grow: 1; 
    margin: 0 auto;
}
#site-header .nav-list {
    display: flex;
    list-style: none;
    padding: 0;
    margin: 0;
    gap: var(--spacing-lg);
}
#site-header .nav-list li a {
    color: var(--color-text-default);
    padding: var(--spacing-sm) 0;
    display: block;
    font-weight: 500;
    transition: color var(--transition-speed), border-bottom var(--transition-speed);
}
#site-header .nav-list li a:hover {
    color: var(--color-accent-primary);
    border-bottom: 2px solid var(--color-accent-primary);
}
@media (max-width: 768px) {
#site-header .container {
        flex-direction: column;
        align-items: flex-start;
        padding: var(--spacing-sm) var(--spacing-md);
    }
#site-header .nav-list {
        flex-wrap: wrap;
        justify-content: center;
        margin-top: var(--spacing-md);
        gap: 10px; 
    }
#site-header .nav-list li a {
        padding: 8px 12px;
        border-bottom: none !important; 
    }
}

  </style>
</head>
<body>
  <header id="site-header">
    <div class="brand">Kanban WebApp</div>
    <nav>
      <ul class="nav-list">
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#kanban-board">Tablero Kanban</a></li>
        <li><a href="#tarjetas-crear">Crear Tarjeta</a></li>
        <li><a href="#comentarios">Actividad</a></li>
      </ul>
    </nav>
  </header>
  <main id="app">
  <section id="inicio" data-feature="R1 R2 R3 R4 R5 R6 R8 R9">
    <h2>Inicio</h2>
  </section>
  </main>
  <footer id="site-footer">
    <p>Kanban WebApp</p>
  </footer>
<script data-file="api.js">
// Capa de datos SIMULADA (backend mock). Los componentes usan solo window.api.
window.api = window.api || {};

// No se requiere ninguna función API adicional para el encabezado.


</script>
<script data-component="site-header">
(function (root) {
  if (!root) return;
// No JavaScript necesario para este componente estático de cabecera y navegación.

})(document.getElementById("site-header"));
</script>
</body>
</html>
