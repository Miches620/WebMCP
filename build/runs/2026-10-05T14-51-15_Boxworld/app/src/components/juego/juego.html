<section data-feature="R1 R2 R3" id="juego" class="container">
    <h2>Boxworld 📦</h2>
    <p>Ayuda al avatar a acomodar todas las cajas en su lugar antes de que se acabe el tiempo.</p>

    <div id="game-board-wrapper">
        <!-- El tablero de juego será renderizado aquí -->
        <div id="map-grid" class="map-grid">
            <!-- Las celdas del mapa irán aquí (Avatar, Cajas, Espacio) -->
        </div>
    </div>

    <div class="controls">
        <button id="btn-move-up" class="btn move-btn" aria-label="Mover Arriba">⬆️</button>
        <button id="btn-move-left" class="btn move-btn" aria-label="Mover Izquierda">⬅️</button>
        <div style="display: flex; gap: 1rem;">
            <button id="btn-restart" class="btn secondary-btn">🔄 Reiniciar Nivel</button>
            <button id="btn-next-level" class="btn primary-btn">➡️ Próximo Nivel</button>
        </div>
        <button id="btn-move-right" class="btn move-btn" aria-label="Mover Derecha">➡️</button>
        <button id="btn-move-down" class="btn move-btn" aria-label="Mover Abajo">⬇️</button>
    </div>

    <div id="game-status" style="margin-top: 1rem; font-size: 1.2rem;">
        <!-- Aquí se mostrará el estado del juego (Mensajes, Victoria) -->
    </div>
</section>
