<section data-feature="R1 R2 R7" id="juego">
  <h2>Boxworld 📦</h2>
  <div class="game-status">
    <p>Nivel: <span id="nivel-actual">1</span> / 5</p>
    <p>Movimientos: <span id="contador-movimientos">0</span></p>
    <p>Cajas por colocar: <span id="cajas-restantes">?</span></p>
  </div>

  <div class="game-container">
    <!-- El mapa se renderizará aquí -->
    <div id="mapa-grid" class="map-grid" data-cols="8" data-rows="6">
      <!-- Los tiles serán generados por JS -->
    </div>
  </div>

  <div id="controls" class="btn-group">
    <button id="reiniciar-btn" class="btn">🔄 Reiniciar Nivel</button>
    <button id="proximo-nivel-btn" class="btn" disabled>➡️ Próximo Nivel</button>
  </div>

  <!-- Mensaje de resultado del juego -->
  <div id="mensaje-juego" class="game-message hidden"></div>
</section>
