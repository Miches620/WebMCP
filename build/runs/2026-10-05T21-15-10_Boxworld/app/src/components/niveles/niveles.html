<section data-feature="R3" id="niveles">
  <h2>Boxworld: Acomoda las Cajas</h2>
  <div class="game-container">
    <div id="status-panel">
      <div class="stat-box">Nivel: <span id="level-display">1</span> / 5</div>
      <div class="stat-box">Movimientos: <span id="score-display">0</span></div>
      <button id="btn-restart" class="btn">🔄 Reiniciar Nivel</button>
    </div>

    <div id="game-viewport">
      <!-- El tablero de juego se generará aquí -->
      <div id="board-grid" class="grid-container"></div>
    </div>

    <div class="controls-bottom">
        <p>Usa las flechas direccionales (⬆️ ⬇️ ⬅️ ➡️) para mover al avatar.</p>
        <button id="btn-next-level" class="btn" disabled>Próximo Nivel ▶️</button>
    </div>

    <div id="message-area" class="message-box">
      ¡Bienvenido a Boxworld! Acomoda las cajas en su lugar.
    </div>
  </div>
</section>
