<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boxworld</title>
  <style>
/* ===== tokens.css (global) ===== */
:root {
    
    --color-bg-primary: #1a1a2e; 
    --color-text-dark: #d9d9d9; 
    --color-text-primary: #ffffff; 
    --color-accent: #ff6b6b; 
    --color-secondary: #4ecdc4; 
    --color-success: #7ed87e; 

    
    --font: 'Press Start 2P', system-ui, -apple-system, Roboto, monospace; 
    --border-radius: 4px; 
    --shadow-base: 3px 3px 0 var(--color-accent); 

    
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 16px;
    --space-lg: 32px;
    --space-xl: 64px;

    
    --transition-speed: 0.2s;
}
*, *::before, *::after {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 0;
    background-color: var(--color-bg-primary);
    color: var(--color-text-dark);
    font-family: var(--font);
    line-height: 1.6;
}
h1, h2, h3 {
    margin-top: 0;
    margin-bottom: var(--space-md);
    line-height: 1.2;
    color: var(--color-text-primary);
    
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
}
h1 { font-size: 2rem; }
h2 { font-size: 1.75rem; border-bottom: var(--space-xs) solid var(--color-secondary); padding-bottom: var(--space-sm); }
h3 { font-size: 1.4rem; color: var(--color-accent); }
p {
    margin-bottom: var(--space-md);
}
a {
    color: var(--color-secondary);
    text-decoration: none;
    transition: color var(--transition-speed) ease, background-color var(--transition-speed) ease;
    cursor: pointer;
}
a:hover {
    color: var(--color-accent);
    text-decoration: underline;
}
.container {
    max-width: 1200px; 
    margin: 0 auto;
    padding: 0 var(--space-lg);
}
.btn {
    display: inline-block;
    padding: var(--space-sm) var(--space-md);
    background-color: var(--color-accent);
    color: var(--color-text-primary);
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    
    box-shadow: var(--shadow-base);
    transition: all var(--transition-speed) ease;
    text-transform: uppercase;
}
.btn:hover {
    background-color: #ff8c8c; 
    box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3); 
    transform: translate(2px, 2px);
}
.btn:disabled {
    background-color: #555;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

/* ===== componente #site-header ===== */
#site-header {
    background-color: var(--color-bg-primary);
    padding: var(--space-sm) 0;
    border-bottom: 4px solid var(--color-secondary); 
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap; 
}
#site-header .brand {
    font-size: 2rem;
    color: var(--color-text-primary);
    
    text-shadow: 4px 4px 0 #3a3a5e; 
}
#site-header .nav-list {
    display: flex;
    list-style: none;
    padding: 0;
    margin: 0;
}
#site-header .nav-list li {
    margin-left: var(--space-md);
}
#site-header .nav-link {
    color: var(--color-text-dark);
    font-size: 1rem;
    padding: var(--space-xs) var(--space-sm);
    display: block;
    border-bottom: 2px solid transparent; 
    transition: all var(--transition-speed) ease;
}
#site-header .nav-link:hover {
    color: var(--color-secondary);
    background-color: rgba(255, 107, 107, 0.1); 
    border-bottom: 2px solid var(--color-accent);
}
@media (max-width: 450px) {
#site-header {
        flex-direction: column;
        text-align: center;
        padding: var(--space-sm) var(--space-md);
    }
#site-header .brand {
        margin-bottom: var(--space-sm);
    }
#site-header .nav-list {
        flex-direction: row;
        flex-wrap: wrap; 
        justify-content: center;
    }
#site-header .nav-list li {
        margin: 0 var(--space-sm);
    }
}

  </style>
</head>
<body>
  <header id="site-header">
      <div class="brand">BOXWORLD</div>
      <nav>
          <ul class="nav-list">
              <li><a href="#juego" class="nav-link">🎮 Juego</a></li>
              <li><a href="#niveles" class="nav-link">🗺️ Niveles</a></li>
          </ul>
      </nav>
  </header>
  <main id="app">
  <section id="juego" data-feature="R1 R2 R7">
    <h2>Juego</h2>
  </section>

  <section id="niveles" data-feature="R3">
    <h2>Niveles</h2>
  </section>
  </main>
  <footer id="site-footer">
    <p>Boxworld</p>
  </footer>
<script data-file="api.js">
// Capa de datos SIMULADA (backend mock). Los componentes usan solo window.api.
window.api = window.api || {};

// No se requieren nuevas funciones API en este paso.


</script>
<script data-component="site-header">
(function (root) {
  if (!root) return;
// No se requiere lógica compleja para este componente de navegación estático.

})(document.getElementById("site-header"));
</script>
</body>
</html>
