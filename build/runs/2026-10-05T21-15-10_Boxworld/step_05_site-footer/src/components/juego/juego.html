<section data-feature="R1 R2 R7" id="juego">
    <h2 class="game-title">Boxworld Challenge</h2>
    
    <!-- HUD Area -->
    <div class="hud-container">
        <div class="score-display">Movimientos: <span id="move-counter">0</span></div>
        <div class="status-message" id="game-status">¡Acomoda las cajas!</div>
    </div>

    <!-- Game Grid Container -->
    <div id="mapa-juego" class="grid-container">
        <!-- El grid se generará aquí con JS -->
    </div>

    <!-- Controls -->
    <div class="controls-container">
        <button id="btn-reiniciar" class="btn" disabled>🔄 Reiniciar Nivel</button>
        <button id="btn-proximo-nivel" class="btn" disabled>➡️ Próximo Nivel</button>
    </div>

    <!-- Mensaje de Fin de Juego/Victoria -->
    <div id="mensaje-victoria" style="display: none;" class="message-overlay">
        <h3 class="victory-title">🎉 ¡Nivel Completado! 🎉</h3>
        <p class="victory-text">¡Has acomodado todas las cajas en su lugar!</p>
        <button id="btn-continuar-victoria" class="btn">Continuar</button>
    </div>
</section>
