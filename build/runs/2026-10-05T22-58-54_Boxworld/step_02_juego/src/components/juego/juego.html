<section data-feature="R1 R2 R3 R4 R5 R6 R7" id="juego">
    <h1>Boxworld</h1>
    <div class="game-container">
        <!-- HUD (Heads Up Display) -->
        <div id="hud" class="hud-panel">
            <div class="stat-box">Nivel: <span id="nivel-display">1</span> / 5</div>
            <div class="stat-box">Movimientos: <span id="contador-movimientos">0</span></div>
        </div>

        <!-- Grid Container (The actual game board) -->
        <div id="mapa" class="game-grid">
            <!-- Cells will be rendered here by JS -->
        </div>

        <!-- Controls and Status -->
        <div id="controls" class="control-panel">
            <button id="btn-reiniciar" class="btn" disabled>🔄 Reiniciar Nivel</button>
            <button id="btn-proximo-nivel" class="btn">➡️ Próximo Nivel</button>
        </div>

        <!-- Mensaje de estado -->
        <div id="mensaje-estado" class="message-box hidden"></div>
    </div>
</section>
