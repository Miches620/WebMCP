<section data-feature="R1 R2 R3 R4 R5 R6 R7" id="juego">
    <h1>Boxworld</h1>
    <div class="game-container">
        <!-- HUD (Heads Up Display) -->
        <div id="hud" class="nes-panel">
            <div class="stat-block">
                <label>Nivel:</label>
                <span id="nivel-display">1</span>
            </div>
            <div class="stat-block">
                <label>Movimientos:</label>
                <span id="movimiento-contador">0</span>
            </div>
        </div>

        <!-- Grid Container (The 10x10 map) -->
        <div id="mapa" class="grid-container">
            <!-- El grid se llenará con JS -->
        </div>

        <!-- Controles y Botones -->
        <div id="controles" class="nes-panel controls-group">
            <button id="btn-reiniciar" class="btn btn-restart">🔄 Reiniciar Nivel</button>
            <button id="btn-proximo-nivel" class="btn btn-next">➡️ Próximo Nivel</button>
        </div>

        <!-- Mensaje de estado del juego -->
        <div id="mensaje-juego" class="nes-message hidden"></div>
    </div>
</section>
