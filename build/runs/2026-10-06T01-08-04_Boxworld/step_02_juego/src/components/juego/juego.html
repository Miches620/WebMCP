<section data-feature="R1 R2 R3 R4 R5 R6 R7" id="juego">
    <div class="game-header">
        <h2 style="font-size: 1.5em; border-bottom: none;">Boxworld Puzzle</h2>
        <div class="hud">
            <div>Nivel: <span id="nivel-actual">1</span> / <span id="total-niveles">5</span></div>
            <div>Movimientos: <span id="contador-movimientos">0</span></div>
        </div>
    </div >

    <div class="game-board-container">
        <!-- El grid 10x10 se renderizará aquí -->
        <div id="grid" class="grid-10x10">
            <!-- Los casilleros individuales irán aquí -->
        </div>
    </div >

    <div class="game-controls">
        <button id="btn-reiniciar" class="btn" disabled>🔄 Reiniciar Nivel</button>
        <button id="btn-proximo-nivel" class="btn">➡️ Próximo Nivel</button>
    </div>

    <!-- Corregido: Añadimos un h3 dentro del overlay para que el JS pueda acceder a él -->
    <div id="mensaje-juego" class="message-overlay hidden">
        <h3></h3>
    </div>
</section>
