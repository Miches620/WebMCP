<section data-feature="R1 R2 R3 R4 R5 R6 R7" id="juego" class="game-container">
    <h2>Boxworld</h2>

    <!-- HUD (Heads Up Display) -->
    <div id="hud" class="hud-panel">
        <div class="stat-box">Nivel: <span id="nivel-display">1</span> / 5</div>
        <div class="stat-box">Movimientos: <span id="movimiento-contador">0</span></div>
    </div>

    <!-- Grid Container (The actual map) -->
    <div id="mapa" class="grid-container">
        <!-- Tiles will be rendered here by JS -->
    </div>

    <!-- Controls and Status -->
    <div id="controls" class="control-panel">
        <button id="btn-reiniciar" class="btn" disabled>🔄 Reiniciar Nivel</button>
        <button id="btn-proximo-nivel" class="btn">➡️ Próximo Nivel</button>

        <!-- Mensaje de estado del juego -->
        <div id="mensaje-juego" class="game-message hidden"></div>
    </div>
</section>
