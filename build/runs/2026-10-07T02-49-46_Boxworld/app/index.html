<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boxworld</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="juego" data-feature="R1 R2 R3 R4 R5 R6 R7">
<div id="contenedor">
    <h1>Boxworld</h1>
    <div class="hud-container">
        <div id="nivel">Nivel 1</div>
        <div id="movimientos">Movimientos: 0</div>
    </div>

    <div id="tablero" style="display: grid;">
        <!-- Los casilleros se insertarán aquí por JavaScript -->
    </div>

    <div id="mensaje" class="mensaje-area">¡Bienvenido a Boxworld! Usa las flechas para moverte.</div>

    <div class="controles-botones">
        <button id="btn-reiniciar">Reiniciar Nivel</button>
        <button id="btn-siguiente">Siguiente Nivel</button>
    </div>
</div>
</main>
<script src="js/niveles.js"></script>
<script src="js/reglas.js"></script>
<script src="js/dibujo.js"></script>
<script src="js/controles.js"></script>
</body>
</html>
