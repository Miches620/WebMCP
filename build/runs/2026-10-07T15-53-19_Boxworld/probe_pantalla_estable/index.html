<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boxworld</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="juego" data-feature="R1 R2 R3 R4 R5 R6 R7">
<div id="contenedor">
    <h1>Boxworld</h1>
    <div class="hud-container">
        <div id="nivel">Nivel 1</div>
        <div id="movimientos">Movimientos: 0</div>
    </div>

    <div id="tablero" style="display: grid;">
        <!-- Los casilleros se insertarán aquí por JavaScript -->
    </div>

    <div id="mensaje" class="mensaje-area">¡Bienvenido a Boxworld! Usa las flechas para moverte.</div>

    <div class="controles-botones">
        <button id="btn-reiniciar">Reiniciar Nivel</button>
        <button id="btn-siguiente">Siguiente Nivel</button>
    </div>
</div>
</main>

<script>
window.__probe = (function () {
  try {
    var box = document.getElementById("tablero"), msg = document.getElementById("mensaje");
    if (!box || !msg) return { ok: false, error: "falta #tablero o #mensaje" };
    box.style.gridTemplateColumns = "repeat(10, 1fr)";
    for (var i = 0; i < 20; i++) { var d = document.createElement("div"); d.className = "casillero piso"; box.appendChild(d); }
    var m = function () { var c = box.children, a = c[0].getBoundingClientRect(), b = c[1].getBoundingClientRect(), r = box.getBoundingClientRect();
      return { w: Math.round(r.width), h: Math.round(r.height), cell: Math.round(Math.min(a.width, a.height)), gap: Math.round(b.left - a.right) }; };
    var before = m(); msg.textContent = "¡Nivel completado! Presioná 'Próximo Nivel' para continuar con el siguiente desafío del juego."; var after = m();
    return { ok: true, before: before, after: after };
  } catch (err) { return { ok: false, error: String(err && err.message || err) }; }
})();
</script>
</body>
</html>
