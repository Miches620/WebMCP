<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deposito</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="juego" data-feature="R1 R2 R3 R4 R5 R6 R7">
<div class="contenedor-juego">
    <h1>Depósito Puzzle</h1>

    <div class="panel-info">
        <div class="contador-grupo">
            Nivel: <span id="nivel">1</span>
        </div>
        <div class="contador-grupo">
            Movimientos: <span id="movimientos">0</span>
        </div>
    </div>

    <div id="tablero" class="contenedor-tablero">
        <!-- Los casilleros se insertarán aquí por JavaScript -->
    </div>

    <div id="mensaje" class="panel-mensaje">
        Bienvenido. Usa las flechas para mover al operario.
    </div>

    <div class="controles-botones">
        <button id="btn-reiniciar">Reiniciar Nivel</button>
        <button id="btn-siguiente">Siguiente Nivel</button>
    </div>
</div>
</main>
<script src="js/niveles.js"></script>
<script src="js/reglas.js"></script>
<script src="js/dibujo.js"></script>
<script src="js/controles.js"></script>
</body>
</html>
