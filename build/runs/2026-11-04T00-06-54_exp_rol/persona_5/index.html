<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Avanzada</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="spreadsheet-container">
        <!-- Cabecera superior (Columnas A-J) -->
        <header class="col-headers">
            <div class="corner-cell corner-spacer"></div>
            <span class="col-label" data-col-index="A">A</span>
            <span class="col-label" data-col-index="B">B</span>
            <span class="col-label" data-col-index="C">C</span>
            <span class="col-label" data-col-index="D">D</span>
            <span class="col-label" data-col-index="E">E</span>
            <span class="col-label" data-col-index="F">F</span>
            <span class="col-label" data-col-index="G">G</span>
            <span class="col-label" data-col-index="H">H</span>
            <span class="col-label" data-col-index="I">I</span>
            <span class="col-label" data-col-index="J">J</span>
        </header>

        <!-- Contenedor de celdas (Filas 1-20) -->
        <div id="grid-rows">
            <!-- Aquí se generarán las filas mediante JavaScript, pero necesitamos la estructura base para los encabezados de fila y el grid. -->
            <!-- Ejemplo de cómo debe verse una fila: -->
            
            <!-- Fila 1 (Ejemplo estático para referencia) -->
            <div class="row-header">1</div>
            <div class="grid-row" data-row-index="0">
                <div class="cell" data-col-index="A" data-row-index="0" contenteditable="true"></div>
                <div class="cell" data-col-index="B" data-row-index="0" contenteditable="true"></div>
                <div class="cell" data-col-index="C" data-row-index="0" contenteditable="true"></div>
                <div class="cell" data-col-index="D" data-row-index="0" contenteditable="true"></div>
                <div class="cell" data-col-index="E" data-row-index="0" contenteditable="true"></div>
                <div class="cell" data-col-index="F" data-row-index="0" contenteditable="true"></div>
                <div class="cell" data-col-index="G" data-row-index="0" contenteditable="true"></div>
                <div class="cell" data-col-index="H" data-row-index="0" contenteditable="true"></div>
                <div class="cell" data-col-index="I" data-row-index="0" contenteditable="true"></div>
                <div class="cell" data-col-index="J" data-row-index="0" contenteditable="true"></div>
            </div>

            <!-- Se requiere generar 19 filas más, siguiendo la estructura. -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
