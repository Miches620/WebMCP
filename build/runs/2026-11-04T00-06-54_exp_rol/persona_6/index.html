<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Sin Framework</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor principal del panel de control (para botones y herramientas) -->
    <div id="toolbar">
        <button id="btn-format-background">Color Fondo...</button>
        <!-- Botones de acción para la selección activa (fila/columna) -->
        <button id="btn-delete-selected" disabled>Borrar Selección</button>
        <button id="btn-clear-selection" disabled>Vaciar Contenido</button>
    </div>

    <!-- Estructura principal de la hoja de cálculo -->
    <div id="spreadsheet-container">
        
        <!-- Cabecera superior (Columnas A a J) -->
        <div id="column-headers">
            <!-- Los encabezados se generarán dinámicamente o se listan aquí para estructura estática inicial. 
                 Dado que el JS debe manejar la lógica, solo necesitamos el contenedor principal y los elementos de esquina/lateral. -->
            <div class="corner-cell"></div> <!-- Esquina superior izquierda (donde no va nada) -->
            <!-- Columnas A a J -->
        </div>

        <!-- El grid real: Contiene las filas y celdas -->
        <div id="grid-area">
            <!-- Esta área contendrá todas las celdas, gestionadas por JS -->
            <!-- Ejemplo de estructura para 20 filas (1 a 20) y 10 columnas (A a J) -->

            <!-- La lógica del grid se maneja completamente con JavaScript para asegurar la interactividad. 
                 Solo necesitamos un contenedor principal que el script va a poblar o gestionar. -->
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
