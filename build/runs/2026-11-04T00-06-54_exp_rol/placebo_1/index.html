<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Profesional</title>
    <!-- Enlaza la hoja de estilos CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor principal que simula el área de trabajo de Excel -->
    <div class="spreadsheet-container">
        
        <!-- Sección de cabeceras de columna (A a J) -->
        <header class="column-headers">
            <!-- Las letras se generarán dinámicamente o se listarán manualmente A-J -->
            <div class="corner-cell"></div> 
            <div id="col-A" class="column-letter">A</div>
            <div id="col-B" class="column-letter">B</div>
            <div id="col-C" class="column-letter">C</div>
            <div id="col-D" class="column-letter">D</div>
            <div id="col-E" class="column-letter">E</div>
            <div id="col-F" class="column-letter">F</div>
            <div id="col-G" class="column-letter">G</div>
            <div id="col-H" class="column-letter">H</div>
            <div id="col-I" class="column-letter">I</div>
            <div id="col-J" class="column-letter">J</div>
        </header>

        <!-- Contenedor de la grilla de celdas (Filas y Columnas) -->
        <main id="spreadsheet-grid">
            <!-- Las filas se generarán aquí por JavaScript, pero definimos el contenedor principal. -->
        </main>
    </div>

    <!-- Enlaza la lógica de JavaScript al final del body para asegurar que el DOM esté cargado -->
    <script src="script.js"></script>

</body>
</html>
