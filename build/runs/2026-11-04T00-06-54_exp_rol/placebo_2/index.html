<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Avanzada</title>
    <!-- Enlace a la hoja de estilos CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor principal que simula el área de trabajo de la hoja -->
    <div id="spreadsheet-wrapper">
        <!-- La tabla es el elemento central para estructurar datos tipo hoja de cálculo -->
        <table id="spreadsheet-container">
            <thead>
                <!-- Fila de encabezados de columna (A a J) -->
                <tr>
                    <th class="corner-cell"></th> <!-- Esquina superior izquierda vacía -->
                    <th>A</th>
                    <th>B</th>
                    <th>C</th>
                    <th>D</th>
                    <th>E</th>
                    <th>F</th>
                    <th>G</th>
                    <th>H</th>
                    <th>I</th>
                    <th>J</th>
                </tr>
            </thead>
            <tbody id="spreadsheet-body">
                <!-- Las filas se generarán en JavaScript, pero aquí ponemos la estructura inicial -->
                <!-- Se generan 20 filas (1 a 20) -->
            </tbody>
        </table>
    </div>

    <!-- Script principal que manejará toda la lógica de la aplicación -->
    <script src="script.js"></script>
</body>
</html>
