<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo</title>
    <!-- Enlace a la hoja de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Hojas de Cálculo</h1>

    <!-- Contenedor principal de la tabla de cálculo -->
    <div id="spreadsheet-container">
        <table id="spreadsheet">
            <thead>
                <tr>
                    <!-- Encabezado para el número de fila vacía (esquina superior izquierda) -->
                    <th></th> 
                    <!-- Columnas A a J -->
                    <th class="column-header" data-col="A">A</th>
                    <th class="column-header" data-col="B">B</th>
                    <th class="column-header" data-col="C">C</th>
                    <th class="column-header" data-col="D">D</th>
                    <th class="column-header" data-col="E">E</th>
                    <th class="column-header" data-col="F">F</th>
                    <th class="column-header" data-col="G">G</th>
                    <th class="column-header" data-col="H">H</th>
                    <th class="column-header" data-col="I">I</th>
                    <th class="column-header" data-col="J">J</th>
                </tr>
            </thead>
            <tbody>
                <!-- Filas 1 a 20 -->
                <tr id="row-label-1">
                    <!-- Celda de etiqueta de fila (Número) -->
                    <td class="row-label">1</td>
                    <!-- Celdas A1 a J1 -->
                    <td class="cell" data-col="A" data-row="1"></td>
                    <td class="cell" data-col="B" data-row="1"></td>
                    <td class="cell" data-col="C" data-row="1"></td>
                    <td class="cell" data-col="D" data-row="1"></td>
                    <td class="cell" data-col="E" data-row="1"></td>
                    <td class="cell" data-col="F" data-row="1"></td>
                    <td class="cell" data-col="G" data-row="1"></td>
                    <td class="cell" data-col="H" data-row="1"></td>
                    <td class="cell" data-col="I" data-row="1"></td>
                    <td class="cell" data-col="J" data-row="1"></td>
                </tr>
                <tr id="row-label-2">
                    <td class="row-label">2</td>
                    <td class="cell" data-col="A" data-row="2"></td>
                    <td class="cell" data-col="B" data-row="2"></td>
                    <td class="cell" data-col="C" data-row="2"></td>
                    <td class="cell" data-col="D" data-row="2"></td>
                    <td class="cell" data-col="E" data-row="2"></td>
                    <td class="cell" data-col="F" data-row="2"></td>
                    <td class="cell" data-col="G" data-row="2"></td>
                    <td class="cell" data-col="H" data-row="2"></td>
                    <td class="cell" data-col="I" data-row="2"></td>
                    <td class="cell" data-col="J" data-row="2"></td>
                </tr>
                <tr id="row-label-3">
                    <td class="row-label">3</td>
                    <td class="cell" data-col="A" data-row="3"></td>
                    <td class="cell" data-col="B" data-row="3"></td>
                    <td class="cell" data-col="C" data-row="3"></td>
                    <td class="cell" data-col="D" data-row="3"></td>
                    <td class="cell" data-col="E" data-row="3"></td>
                    <td class="cell" data-col="F" data-row="3"></td>
                    <td class="cell" data-col="G" data-row="3"></td>
                    <td class="cell" data-col="H" data-row="3"></td>
                    <td class="cell" data-col="I" data-row="3"></td>
                    <td class="cell" data-col="J" data-row="3"></td>
                </tr>
                <tr id="row-label-4">
                    <td class="row-label">4</td>
                    <td class="cell" data-col="A" data-row="4"></td>
                    <td class="cell" data-col="B" data-row="4"></td>
                    <td class="cell" data-col="C" data-row="4"></td>
                    <td class="cell" data-col="D" data-row="4"></td>
                    <td class="cell" data-col="E" data-row="4"></td>
                    <td class="cell" data-col="F" data-row="4"></td>
                    <td class="cell" data-col="G" data-row="4"></td>
                    <td class="cell" data-col="H" data-row="4"></td>
                    <td class="cell" data-col="I" data-row="4"></td>
                    <td class="cell" data-col="J" data-row="4"></td>
                </tr>
                <!-- Se repite hasta la fila 20 -->
                
            </tbody>
        </table>
    </div>

    <!-- Enlace al script de funcionalidad -->
    <script src="script.js"></script>
</body>
</html>
