<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet App</title>
    <!-- Enlace a la hoja de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor principal del área de trabajo (grid) -->
    <div id="spreadsheet-container">
        
        <!-- Cabecera de Columnas (A - J) -->
        <header id="column-headers">
            <!-- Los nombres de columna serán generados o se definen aquí estáticamente -->
            <div class="corner-cell"></div> <!-- Celda superior izquierda vacía -->
            <div class="col-label" data-col="A">A</div>
            <div class="col-label" data-col="B">B</div>
            <div class="col-label" data-col="C">C</div>
            <div class="col-label" data-col="D">D</div>
            <div class="col-label" data-col="E">E</div>
            <div class="col-label" data-col="F">F</div>
            <div class="col-label" data-col="G">G</div>
            <div class="col-label" data-col="H">H</div>
            <div class="col-label" data-col="I">I</div>
            <div class="col-label" data-col="J">J</div>
        </header>

        <!-- Contenedor principal de la hoja (filas y celdas) -->
        <main id="spreadsheet-grid"></main>
    </div>

    <!-- Enlace al script de lógica de negocio -->
    <script src="script.js"></script>

</body>
</html>
