<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo</title>

    <!-- Enlace a la hoja de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="spreadsheet-container">
        <!-- Contenedor para los selectores de columna y fila -->
        <div class="header-selectors">
            <div class="row-headers">
                <!-- Aquí irán los números de las filas (1 a 20) -->
            </div>
            <div class="column-labels">
                <!-- Las letras A a J se manejarán con JavaScript o estarán en un área dedicada -->
            </div>
        </div>

        <!-- Contenedor principal del grid de celdas (A1:J20) -->
        <div id="sheet-grid">
            <!-- Aquí irán las 20 filas, cada una con 10 celdas -->
        </div>
    </div>

    <!-- Botones de control global para la hoja -->
    <div class="controls">
        <button id="delete-row-btn" disabled>Borrar Fila</button>
        <button id="delete-col-btn" disabled>Borrar Columna</button>
        <button id="clear-all-content-btn">Vaciar Contenido Total</button>
    </div>

    <!-- Script de lógica al final del body -->
    <script src="script.js"></script>
</body>
</html>
