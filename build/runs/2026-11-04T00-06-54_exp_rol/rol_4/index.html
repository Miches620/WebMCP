<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Avanzada</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="spreadsheet-container">
        <h1>App de Hoja de Cálculo</h1>

        <!-- Controles Globales (Simulados para la prueba) -->
        <div class="controls">
            <label for="background-color-picker">Color de Fondo:</label>
            <input type="color" id="background-color-picker" value="#ffffff">
            <button id="clear-selection-content">Borrar Contenido Seleccionado</button>
        </div>

        <!-- Estructura principal de la tabla -->
        <table id="spreadsheet-table">
            <thead>
                <tr>
                    <th></th> <!-- Esquina superior izquierda (Vacío) -->
                    <th class="col-header" data-col-name="A">A</th>
                    <th class="col-header" data-col-name="B">B</th>
                    <th class="col-header" data-col-name="C">C</th>
                    <th class="col-header" data-col-name="D">D</th>
                    <th class="col-header" data-col-name="E">E</th>
                    <th class="col-header" data-col-name="F">F</th>
                    <th class="col-header" data-col-name="G">G</th>
                    <th class="col-header" data-col-name="H">H</th>
                    <th class="col-header" data-col-name="I">I</th>
                    <th class="col-header" data-col-name="J">J</th>
                </tr>
            </thead>
            <tbody>
                <!-- Las filas 1 a 20 se generarán dinámicamente, pero definimos la estructura para el scaffolding -->
                <!-- Fila 1 (La primera fila de datos) -->
                <tr class="sheet-row" data-row-index="1">
                    <th class="row-header" data-row-name="1">1</th>
                    <td class="cell" data-col-name="A" data-row-index="1" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="B" data-row-index="1" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="C" data-row-index="1" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="D" data-row-index="1" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="E" data-row-index="1" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="F" data-row-index="1" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="G" data-row-index="1" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="H" data-row-index="1" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="I" data-row-index="1" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="J" data-row-index="1" contenteditable="true" tabindex="0"></td>
                </tr>

                <!-- Fila 2 -->
                <tr class="sheet-row" data-row-index="2">
                    <th class="row-header" data-row-name="2">2</th>
                    <td class="cell" data-col-name="A" data-row-index="2" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="B" data-row-index="2" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="C" data-row-index="2" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="D" data-row-index="2" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="E" data-row-index="2" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="F" data-row-index="2" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="G" data-row-index="2" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="H" data-row-index="2" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="I" data-row-index="2" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="J" data-row-index="2" contenteditable="true" tabindex="0"></td>
                </tr>

                <!-- Se deben incluir hasta la Fila 20. Para el alcance de este ejercicio, solo se muestran las primeras filas para mantener concisión en HTML, pero JavaScript debe asumir que el modelo maneja todas las 20. -->
                <tr class="sheet-row" data-row-index="3">
                    <th class="row-header" data-row-name="3">3</th>
                    <td class="cell" data-col-name="A" data-row-index="3" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="B" data-row-index="3" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="C" data-row-index="3" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="D" data-row-index="3" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="E" data-row-index="3" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="F" data-row-index="3" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="G" data-row-index="3" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="H" data-row-index="3" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="I" data-row-index="3" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="J" data-row-index="3" contenteditable="true" tabindex="0"></td>
                </tr>

                <!-- ... (Aquí irían las filas 4 a 20) ... -->
                <tr class="sheet-row" data-row-index="20">
                    <th class="row-header" data-row-name="20">20</th>
                    <td class="cell" data-col-name="A" data-row-index="20" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="B" data-row-index="20" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="C" data-row-index="20" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="D" data-row-index="20" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="E" data-row-index="20" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="F" data-row-index="20" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="G" data-row-index="20" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="H" data-row-index="20" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="I" data-row-index="20" contenteditable="true" tabindex="0"></td>
                    <td class="cell" data-col-name="J" data-row-index="20" contenteditable="true" tabindex="0"></td>
                </tr>

            </tbody>
        </table>
    </div>


    <script src="script.js"></script>
</body>
</html>
