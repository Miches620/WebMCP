<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="spreadsheet-container">
        <!-- Cabecera de Columnas (A-J) -->
        <header class="column-headers">
            <div class="corner-cell"></div>
            <span id="col-A">A</span>
            <span id="col-B">B</span>
            <span id="col-C">C</span>
            <span id="col-D">D</span>
            <span id="col-E">E</span>
            <span id="col-F">F</span>
            <span id="col-G">G</span>
            <span id="col-H">H</span>
            <span id="col-I">I</span>
            <span id="col-J">J</span>
        </header>

        <!-- Cuerpo de la Hoja (Filas 1-20) -->
        <div class="sheet-body" id="spreadsheet-grid">
            <!-- Las celdas se generarán dinámicamente o se estructurarán aquí manualmente para asegurar el DOM completo. 
                 Dado que JavaScript va a manejar la lógica, es mejor generar la estructura de forma programática en JS, pero si debo incluir HTML estático, debo crear un grid grande. -->

            <!-- Para cumplir con el requisito de tener una estructura visible y funcional al cargar sin depender únicamente del JS inicial (aunque JS lo sobreescribirá), 
                 crearé la estructura completa para las 20 filas y 10 columnas. -->
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
