<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Avanzada</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="header-controls">
        <!-- Controles globales que se usarán para la selección de columnas y filas -->
        <button id="btn-borrar-seleccionado" disabled>🗑️ Borrar Selección</button>
        <select id="color-selector">
            <option value="#ffffff" style="background-color: #ffffff;">Ningún color (Default)</option>
            <option value="#FF0000" style="background-color: #FF0000; color: white;">Rojo</option>
            <option value="#0000FF" style="background-color: #0000FF; color: white;">Azul</option>
            <!-- Se pueden añadir más colores aquí o gestionarlos por JS -->
        </select>
    </div>

    <div id="spreadsheet-wrapper">
        <table>
            <thead>
                <tr>
                    <th class="corner-header" style="width: 40px;"></th>
                    <th class="column-letter" data-col-index="A" data-col-name="A">A</th>
                    <th class="column-letter" data-col-index="B" data-col-name="B">B</th>
                    <th class="column-letter" data-col-index="C" data-col-name="C">C</th>
                    <th class="column-letter" data-col-index="D" data-col-name="D">D</th>
                    <th class="column-letter" data-col-index="E" data-col-name="E">E</th>
                    <th class="column-letter" data-col-index="F" data-col-name="F">F</th>
                    <th class="column-letter" data-col-index="G" data-col-name="G">G</th>
                    <th class="column-letter" data-col-index="H" data-col-name="H">H</th>
                    <th class="column-letter" data-col-index="I" data-col-name="I">I</th>
                    <th class="column-letter" data-col-index="J" data-col-name="J">J</th>
                </tr>
            </thead>
            <tbody>
                <!-- Filas 1 a 20 -->
                <tr id="row-header-1">
                    <th class="row-number corner-header" data-row-index="1">1</th>
                    <!-- Celdas A1 a J1 -->
                    <td class="cell" data-row-index="1" data-col-index="A"></td>
                    <td class="cell" data-row-index="1" data-col-index="B"></td>
                    <td class="cell" data-row-index="1" data-col-index="C"></td>
                    <td class="cell" data-row-index="1" data-col-index="D"></td>
                    <td class="cell" data-row-index="1" data-col-index="E"></td>
                    <td class="cell" data-row-index="1" data-col-index="F"></td>
                    <td class="cell" data-row-index="1" data-col-index="G"></td>
                    <td class="cell" data-row-index="1" data-col-index="H"></td>
                    <td class="cell" data-row-index="1" data-col-index="I"></td>
                    <td class="cell" data-row-index="1" data-col-index="J"></td>
                </tr>

                <!-- Repetir la estructura de las filas 2 a 20 -->
                <!-- Nota: Para mantener el código conciso y funcional, se generan los 19 TR restantes en un bucle JS o manualmente. Aquí solo pongo una representación para asegurar que la estructura sea clara. -->
                <tr id="row-header-2">
                    <th class="row-number corner-header" data-row-index="2">2</th>
                    <!-- Celdas A2 a J2 -->
                    <td class="cell" data-row-index="2" data-col-index="A"></td>
                    <td class="cell" data-row-index="2" data-col-index="B"></td>
                    <td class="cell" data-row-index="2" data-col-index="C"></td>
                    <td class="cell" data-row-index="2" data-col-index="D"></td>
                    <td class="cell" data-row-index="2" data-col-index="E"></td>
                    <td class="cell" data-row-index="2" data-col-index="F"></td>
                    <td class="cell" data-row-index="2" data-col-index="G"></td>
                    <td class="cell" data-row-index="2" data-col-index="H"></td>
                    <td class="cell" data-row-index="2" data-col-index="I"></td>
                    <td class="cell" data-row-index="2" data-col-index="J"></td>
                </tr>

                <!-- ... Se asumiría la repetición para las filas 3 a 19 ... -->

                <tr id="row-header-20">
                    <th class="row-number corner-header" data-row-index="20">20</th>
                    <!-- Celdas A20 a J20 -->
                    <td class="cell" data-row-index="20" data-col-index="A"></td>
                    <td class="cell" data-row-index="20" data-col-index="B"></td>
                    <td class="cell" data-row-index="20" data-col-index="C"></td>
                    <td class="cell" data-row-index="20" data-col-index="D"></td>
                    <td class="cell" data-row-index="20" data-col-index="E"></td>
                    <td class="cell" data-row-index="20" data-col-index="F"></td>
                    <td class="cell" data-row-index="20" data-col-index="G"></td>
                    <td class="cell" data-row-index="20" data-col-index="H"></td>
                    <td class="cell" data-row-index="20" data-col-index="I"></td>
                    <td class="cell" data-row-index="20" data-col-index="J"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
