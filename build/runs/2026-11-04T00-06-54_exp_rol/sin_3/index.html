<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Avanzada</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="spreadsheet-container">

        <!-- 1. Cabecera de Columnas (A - J) -->
        <header id="column-headers">
            <!-- Estas celdas son clickeables para acciones de columna -->
            <div class="corner-cell"></div> <!-- Esquina superior izquierda vacía -->
            <div class="col-header" data-col-index="A">A</div>
            <div class="col-header" data-col-index="B">B</div>
            <div class="col-header" data-col-index="C">C</div>
            <div class="col-header" data-col-index="D">D</div>
            <div class="col-header" data-col-index="E">E</div>
            <div class="col-header" data-col-index="F">F</div>
            <div class="col-header" data-col-index="G">G</div>
            <div class="col-header" data-col-index="H">H</div>
            <div class="col-header" data-col-index="I">I</div>
            <div class="col-header" data-col-index="J">J</div>
        </header>

        <!-- 2. Contenedor Principal de la Hoja -->
        <main id="grid-wrapper">
            <!-- Aquí se generarán dinámicamente las filas y celdas (1 a 20) -->
            <div class="row-number" data-row-index="1">1</div>
            <div class="cell" data-row="1" data-col="A"></div>
            <div class="cell" data-row="1" data-col="B"></div>
            <div class="cell" data-row="1" data-col="C"></div>
            <div class="cell" data-row="1" data-col="D"></div>
            <div class="cell" data-row="1" data-col="E"></div>
            <div class="cell" data-row="1" data-col="F"></div>
            <div class="cell" data-row="1" data-col="G"></div>
            <div class="cell" data-row="1" data-col="H"></div>
            <div class="cell" data-row="1" data-col="I"></div>
            <div class="cell" data-row="1" data-col="J"></div>
        </div>

        <!-- Las siguientes 19 iteraciones de filas se dejarán vacías en el HTML base, 
             ya que JavaScript debe generar la estructura completa (20x10) -->
    </div>


    <script src="script.js"></script>
</body>
</html>
