<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="spreadsheet-container">
        <!-- Encabezados de Columna (A a J) -->
        <div id="column-headers" class="header-row">
            <!-- Los nombres de las columnas se generarán o deben estar aquí estructuralmente -->
            <div class="corner-spacer"></div> 
            <div class="col col-header" data-col="A">A</div>
            <div class="col col-header" data-col="B">B</div>
            <div class="col col-header" data-col="C">C</div>
            <div class="col col-header" data-col="D">D</div>
            <div class="col col-header" data-col="E">E</div>
            <div class="col col-header" data-col="F">F</div>
            <div class="col col-header" data-col="G">G</div>
            <div class="col col-header" data-col="H">H</div>
            <div class="col col-header" data-col="I">I</div>
            <div class="col col-header" data-col="J">J</div>
        </div>

        <!-- Área principal de celdas -->
        <div id="grid-area">
            <!-- El contenido de las 20 filas se generará aquí por JavaScript, pero definimos la estructura de control -->
            <!-- Las filas y sus contenidos serán gestionados dinámicamente para asegurar 20x10 -->
        </div>

        <!-- Controles de acción (Ocultar/Borrar Columna/Fila) - Se pueden colocar al lado o debajo del encabezado -->
        <div id="controls">
            <button id="btn-hide-col" disabled>Ocultar Columna</button>
            <button id="btn-delete-col" disabled>Borrar Columna</button>
            <button id="btn-show-col" disabled>Mostrar Columnas</button>
            <button id="btn-hide-row" disabled>Ocultar Fila</button>
            <button id="btn-delete-row" disabled>Borrar Fila</button>
            <button id="btn-show-row" disabled>Mostrar Filas</button>
        </div>

    </div>

    <!-- Se espera que script.js genere las 20 filas y los 10 contenedores de celda A1:J20 -->
    <script src="script.js"></script>
</body>
</html>
