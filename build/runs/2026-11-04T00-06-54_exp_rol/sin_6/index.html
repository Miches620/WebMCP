<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="spreadsheet-container">
        
        <!-- Controles Globales (Para acciones en columna/fila seleccionada) -->
        <div id="controls" class="control-panel">
            <h3>Controles</h3>
            <button id="delete-col-btn" disabled>Borrar Columna</button>
            <button id="clear-col-btn" disabled>Vaciar Contenido Columna</button>
            <button id="color-col-btn" disabled>Cambiar Color Fondo Columna</button>
            <button id="hide-col-btn" disabled>Ocultar Columna</button>

            <hr>

            <button id="delete-row-btn" disabled>Borrar Fila</button>
            <button id="clear-row-btn" disabled>Vaciar Contenido Fila</button>
            <button id="color-row-btn" disabled>Cambiar Color Fondo Fila</button>
            <button id="hide-row-btn" disabled>Ocultar Fila</button>
        </div>

        <!-- Estructura de la Hoja de Cálculo -->
        <div class="sheet-wrapper">
            
            <!-- Encabezado de Filas (Números 1 a 20) -->
            <div id="row-headers" class="header row-labels">
                <!-- Las celdas para los números se generarán por JS, pero necesitamos la estructura base -->
            </div>

            <!-- Contenedor principal del grid -->
            <div id="grid-container" class="grid-area">
                <!-- Aquí va el contenido de las 20x10 celdas (A1:J20) -->
            </div>

            <!-- Encabezado de Columnas (Letras A a J) -->
            <div id="column-headers" class="header col-labels">
                <!-- Las letras se generarán aquí o mediante JS/HTML estático si es necesario, pero deben estar presentes. -->
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
