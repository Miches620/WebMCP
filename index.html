<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicheLab v0.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .fixed-panel {
        height: 380px;
        display: flex;
        flex-direction: column;
      }
      .fixed-panel-small {
        height: 320px;
        display: flex;
        flex-direction: column;
      }
      .scroll-inner {
        flex: 1;
        overflow-y: auto;
      }
    </style>
  </head>
  <body class="bg-[#12151f] text-white flex justify-center p-4">
    <div class="w-full max-w-[1200px]">
      <div class="flex items-center justify-between mb-4">
        <h1 class="font-bold text-sm">MicheLab v0.2</h1>
        <div class="flex gap-2">
          <button
            id="resumeButton"
            class="hidden px-3 py-1 bg-gray-700 rounded text-xs"
          >
            Continuar
          </button>
          <button
            id="newProjectButton"
            class="hidden px-3 py-1 bg-red-700 rounded text-xs"
          >
            Nuevo
          </button>
          <button
            id="clearBtn"
            class="px-3 py-1 bg-gray-800 rounded text-xs"
          >
            Limpiar
          </button>
        </div>
      </div>

      <div
        id="orchestration-view"
        class="grid grid-cols-1 md:grid-cols-2 gap-4"
      >
        <div
          class="bg-[#242b3d] rounded-lg p-3 border border-gray-700 fixed-panel"
        >
          <div class="flex justify-between shrink-0 mb-2">
            <h2 class="text-xs font-bold text-cyan-400">
              Razonamiento del LLM
            </h2>
          </div>
          <div
            id="refinedPromptPin"
            class="hidden shrink-0 bg-[#1a1f2e] border border-cyan-700 rounded p-2 text-[11px] mb-2 max-h-32 overflow-y-auto"
          ></div>
          <div
            id="llmReasoningOutput"
            class="scroll-inner bg-[#1a1f2e] p-2 rounded text-[11px] font-mono"
          ></div>
        </div>
        <div
          class="bg-[#242b3d] rounded-lg p-3 border border-gray-700 fixed-panel"
        >
          <div class="flex justify-between shrink-0 mb-2">
            <h2 class="text-xs font-bold">Chat</h2>
            <span
              id="intentForgeStatus"
              class="text-[10px] px-2 py-1 bg-gray-600 rounded-full"
              >IDLE</span
            >
          </div>
          <div
            id="intentForgeChatHistory"
            class="scroll-inner bg-[#1a1f2e] p-2 rounded text-xs space-y-2"
          ></div>
          <div class="mt-2 flex gap-2 shrink-0">
            <input
              id="refinementPrompt"
              class="flex-1 bg-gray-800 border border-gray-700 rounded p-2 text-xs"
              placeholder="Contame qué querés construir..."
            />
            <button
              id="chatActionBtn"
              class="px-4 bg-indigo-600 rounded text-xs font-bold"
            >
              Iniciar entrevista
            </button>
          </div>
        </div>
        <div
          class="bg-[#242b3d] rounded-lg p-3 border border-gray-700 fixed-panel-small"
        >
          <div class="flex justify-between shrink-0">
            <h2 class="text-xs font-bold">Lista de Tareas Atómicas</h2>
            <span id="taskCount" class="text-[10px] text-gray-400"></span>
          </div>
          <div
            id="taskListContainer"
            class="scroll-inner mt-2 bg-[#1a1f2e] p-2 rounded text-xs"
          ></div>
        </div>
        <div
          class="bg-[#242b3d] rounded-lg p-3 border border-gray-700 fixed-panel-small"
        >
          <h2 class="text-xs font-bold shrink-0">Vista previa</h2>
          <iframe
            id="livePreviewIframe"
            title="Live preview"
            class="scroll-inner w-full mt-2 bg-white rounded border-0"
          ></iframe>
        </div>
      </div>
    </div>
    <script type="module" src="./script.js"></script>
  </body>
</html>
