<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Contador suelto</title></head>
<body><main id="principal">
<!-- 16/10 (build 2026-10-16T13-54-56): el contador de la columna es "(2)" junto al título, sin la palabra "tarjetas" -->
<div class="columna"><div class="columna-header"><h3>Pendiente</h3><p id="n">(2)</p></div>
<div class="ctl-accion"><input data-campo="titulo" value="x"><button data-accion="crearTarjeta" onclick="var p=document.getElementById('n');p.textContent='('+(parseInt(p.textContent.slice(1))+1)+')'">Crear tarjeta</button></div></div>
<div class="columna"><div class="columna-header"><h3>Completa</h3><p>(1)</p></div><button>Borrar todo</button></div>
</main></body></html>
