<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Cálculo Avanzada</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="spreadsheet-container">
        <!-- Row Labels Column (This area will be populated by JS with row numbers and corner cell) -->
        <div id="row-labels-column-placeholder"></div> 

        <!-- Content Area Wrapper: Contains A-J headers stacked above the main grid -->
        <div id="content-wrapper">
            <!-- Header Row (Column Labels A-J) -->
            <div id="column-labels">
                <!-- Empty corner cell -->
                <div class="corner-cell"></div>
                <!-- Column labels A to J -->
                <div class="label col-header" data-col="A">A</div>
                <div class="label col-header" data-col="B">B</div>
                <div class="label col-header" data-col="C">C</div>
                <div class="label col-header" data-col="D">D</div>
                <div class="label col-header" data-col="E">E</div>
                <div class="label col-header" data-col="F">F</div>
                <div class="label col-header" data-col="G">G</div>
                <div class="label col-header" data-col="H">H</div>
                <div class="label col-header" data-col="I">I</div>
                <div class="label col-header" data-col="J">J</div>
            </div>

            <!-- Main Grid Area -->
            <div id="grid-area">
                <!-- Rows 1 to 20 will be generated here by JS, but we structure the container for them. -->
                <!-- The actual cells will be dynamically created or structured in a way that CSS handles the layout. -->

                <!-- We use a wrapper div and let JavaScript populate the rows/cells based on the required dimensions (20x10). -->
            </div>
        </div>
    </div >

    <div id="controls">
        <button id="btn-clear-selection" disabled>Borrar Selección</button>
        <button id="btn-delete-column" disabled>Eliminar Columna</button>
        <button id="btn-delete-row" disabled>Eliminar Fila</button>
        <input type="color" id="color-picker" value="#ffffff">
        <button id="btn-apply-color">Cambiar Color Fondo</button>
    </div >

    <!-- Script must be at the end of body -->
    <script src="script.js"></script>
</body >
