<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boxworld</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="juego" data-feature="R1 R2 R3 R4 R5 R6 R7">
<div class="game-container">
    <h1>Boxworld</h1>
    <div class="hud">
        <div id="nivel" class="info-box">Nivel: 1</div>
        <div id="movimientos" class="info-box">Movimientos: 0</div>
    </div>

    <div id="tablero" class="game-board">
        <!-- Los casilleros se insertarán aquí por JavaScript -->
    </div>

    <div id="mensaje" class="message-area">¡Bienvenido a Boxworld! Usa las flechas para moverte.</div>

    <div class="controls">
        <button id="btn-reiniciar" disabled>Reiniciar Nivel</button>
        <button id="btn-siguiente">Siguiente Nivel</button>
    </div>
</div>
</main>
<script src="js/niveles.js"></script>
<script src="js/reglas.js"></script>
<script src="js/dibujo.js"></script>
<script src="js/controles.js"></script>
</body>
</html>
