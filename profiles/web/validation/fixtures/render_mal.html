<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>render mal</title></head><body>
<main id="app">
<section id="juego" data-feature="R1"><h2>Juego</h2><div id="tablero"></div><p id="mensaje"></p></section>
<section id="dibujo" data-feature="R2"><h2>Dibujo</h2><canvas id="lienzo" width="40" height="40"></canvas></section>
</main>
<script data-component="juego">
(function (root) {
  if (!root) return;
(root) => {
  const t = root.querySelector('#tablero');
  for (let i = 0; i < 4; i++) t.appendChild(document.createElement('div'));
  root.querySelector('#mensaje').textContent = 'Nivel 1';
}
})(document.getElementById("juego"));
</script>
<script data-component="dibujo">
(function (root) {
  if (!root) return;
  const lienzo = root.querySelector('#lienzo');
  function dibujar() { lienzo.getContext('2d').fillRect(0, 0, 10, 10); }
})(document.getElementById("dibujo"));
</script>
</body></html>
