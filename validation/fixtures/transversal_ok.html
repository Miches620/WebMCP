<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ok</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:sans-serif}
header{position:sticky;top:0;background:#fff;padding:10px;z-index:9} nav a{margin-right:10px}
section{min-height:700px;padding:20px}
#inicio{animation:fade .8s ease-out} @keyframes fade{from{opacity:0}to{opacity:1}}
.btn{background:#06c;color:#fff;padding:8px;border:0} .btn:hover{background:#048}
.card{border:1px solid #ccc;padding:10px;transition:box-shadow .2s} .card:hover{box-shadow:0 4px 10px #0003}
.rev{opacity:0;transition:opacity .3s} .rev.on{opacity:1}
</style></head><body>
<header><nav><a href="#inicio">Inicio</a><a href="#datos">Datos</a><a href="#contacto">Contacto</a></nav></header>
<main>
<section id="inicio"><h1>Hola</h1><p>Subtítulo del producto.</p><button class="btn">Probar gratis</button></section>
<section id="datos"><h2>Datos</h2><div class="card rev">Tarjeta uno con texto</div><div class="card rev">Tarjeta dos con texto</div><p><span class="n" data-to="1200">0</span> usuarios · <span class="n" data-to="35">0</span> países</p></section>
<section id="contacto"><h2>Contacto</h2><p>Escribinos.</p></section>
</main>
<script>
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');
 if(e.target.id==='datos'){document.querySelectorAll('.n').forEach(n=>{let v=0,to=+n.dataset.to;const id=setInterval(()=>{v=Math.min(to,v+Math.ceil(to/20));n.textContent=v;if(v>=to)clearInterval(id)},50)})}}}),{threshold:.1});
document.querySelectorAll('.rev,#datos').forEach(e=>io.observe(e));
</script></body></html>
